openapi: 3.0.0
info:
  title: Alibhai Points API
  description: |
    Loyalty points management system for Alibhai.
    Features: Customer registration, purchase tracking, points redemption, admin management.
  version: 2.0.0
  contact:
    name: Alibhai Support
  servers:
    - url: http://localhost:5000/api
      description: Development server
    - url: https://api.alibhai-points.com/api
      description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /health:
    get:
      summary: Health check
      description: Check if the API is running
      tags:
        - System
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      timestamp:
                        type: string
                      service:
                        type: string
                      version:
                        type: string
                      min_app_version:
                        type: string
                        description: Minimum supported mobile app version

  /me:
    get:
      summary: Get current user profile
      description: Returns the authenticated user's profile and role
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountDisabled'

  /auth/complete-registration:
    post:
      summary: Complete customer registration
      description: Completes registration after OTP verification by creating profile and customer record
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
              properties:
                full_name:
                  type: string
                  minLength: 2
                  maxLength: 100
      responses:
        '200':
          description: Registration completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      created:
                        type: boolean
                      customer_id:
                        type: string
                      customer_code:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /customer/me/redemptions:
    post:
      summary: Create redemption request
      description: Customer requests to redeem points
      tags:
        - Customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - points
              properties:
                points:
                  type: integer
                  minimum: 1
                  maximum: 1000000
      responses:
        '200':
          description: Redemption created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      redemption_id:
                        type: string
                      reference:
                        type: string
                      status:
                        type: string
                      points:
                        type: integer
                      point_value_tzs:
                        type: number
                      value_tzs:
                        type: number
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: List customer redemptions
      description: Returns all redemptions for the authenticated customer
      tags:
        - Customer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Redemptions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      redemptions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            redemption_reference:
                              type: string
                            points_redeemed:
                              type: integer
                            status:
                              type: string
                            redeemed_at:
                              type: string
                            completed_at:
                              type: string
                              nullable: true
                            cancelled_at:
                              type: string
                              nullable: true
                            point_redemption_items:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  product_name:
                                    type: string
                                  quantity:
                                    type: integer
                                  points:
                                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /customer/redemptions:
    post:
      summary: Create redemption request (legacy)
      description: Customer requests to redeem points (legacy endpoint, use /me/redemptions instead)
      tags:
        - Customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - points
              properties:
                points:
                  type: integer
                  minimum: 1
                  maximum: 1000000
      responses:
        '200':
          description: Redemption created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      redemption_id:
                        type: string
                      reference:
                        type: string
                      status:
                        type: string
                      points:
                        type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /customer/purchases:
    get:
      summary: Get customer's purchase history
      description: Returns paginated list of customer's purchases
      tags:
        - Customer
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Purchases retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      purchases:
                        type: array
                        items:
                          $ref: '#/components/schemas/Purchase'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

  /customer/points/summary:
    get:
      summary: Get customer points summary
      description: Returns customer's points breakdown including redeemable, waiting, and expired points
      tags:
        - Customer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Points summary retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      customer_code:
                        type: string
                      status:
                        type: string
                      total_points:
                        type: integer
                      redeemable_points:
                        type: integer
                      waiting_points:
                        type: integer
                      requested_points:
                        type: integer
                      redeemed_points:
                        type: integer
                      expired_points:
                        type: integer
                      next_unlock_at:
                        type: string
                      activity_deadline:
                        type: string
                      days_left:
                        type: integer

  /admin/dashboard:
    get:
      summary: Get admin dashboard metrics
      description: Returns comprehensive statistics for admin dashboard with optional city filter
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: city
          in: query
          schema:
            type: string
          description: Optional city filter to limit all figures to that city
      responses:
        '200':
          description: Dashboard metrics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      customers:
                        type: object
                        properties:
                          total:
                            type: integer
                          active:
                            type: integer
                          inactive:
                            type: integer
                          near_deadline:
                            type: integer
                      points:
                        type: object
                        properties:
                          total_issued:
                            type: integer
                          redeemable:
                            type: integer
                          waiting:
                            type: integer
                          redeemed:
                            type: integer
                          expired:
                            type: integer
                      purchases:
                        type: object
                        properties:
                          total_value:
                            type: number
                          today:
                            type: object
                            properties:
                              count:
                                type: integer
                              value:
                                type: number
                          this_month:
                            type: object
                            properties:
                              count:
                                type: integer
                              value:
                                type: number
                      redemptions:
                        type: object
                        properties:
                          pending_count:
                            type: integer
                      by_city:
                        type: array
                        items:
                          type: object
                          properties:
                            city:
                              type: string
                            customers:
                              type: integer
                            active:
                              type: integer
                            purchases_today:
                              type: integer
                            purchases_this_month:
                              type: integer
                            purchase_value_today:
                              type: number
                            purchase_value_this_month:
                              type: number
                      by_tier:
                        type: array
                        items:
                          type: object
                          properties:
                            tier:
                              type: string
                            customer_count:
                              type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/purchases/preview:
    post:
      summary: Preview purchase
      description: Preview points calculation without recording purchase
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer
                - purchase_amount
              properties:
                customer:
                  type: string
                  minLength: 1
                  maxLength: 20
                  description: Customer code or phone number
                purchase_amount:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1000000000
      responses:
        '200':
          description: Purchase preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      customer_name:
                        type: string
                      customer_status:
                        type: string
                      points_earned:
                        type: integer
                      amount_per_point:
                        type: number
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/purchases:
    post:
      summary: Record purchase
      description: Record a purchase for a customer and award points
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer
                - purchase_amount
                - idempotency_key
              properties:
                customer:
                  type: string
                  minLength: 1
                  maxLength: 20
                  description: Customer code or phone number
                purchase_amount:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1000000000
                idempotency_key:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Purchase recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      reference:
                        type: string
                      points_earned:
                        type: integer
                      new_balance:
                        type: integer
                      customer_status:
                        type: string
                      duplicate:
                        type: boolean
                      purchase_id:
                        type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/purchases:
    get:
      summary: List purchases
      description: List all purchases with optional filters
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Purchases retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      purchases:
                        type: array
                        items:
                          $ref: '#/components/schemas/Purchase'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/purchases/{id}/void:
    post:
      summary: Void purchase
      description: Void a mistaken purchase (only if points unused)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: Purchase voided
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: string
        '400':
          description: Purchase cannot be voided
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/customers/cities:
    get:
      summary: Get customer cities
      description: Returns distinct cities with customer counts for filter dropdown
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cities retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      cities:
                        type: array
                        items:
                          type: object
                          properties:
                            city:
                              type: string
                            customer_count:
                              type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/customers/{identifier}/statement:
    get:
      summary: Get customer statement
      description: Export customer statement as JSON or CSV
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
          description: Customer ID or phone number
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Statement retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
            text/csv:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/tiers:
    get:
      summary: Get loyalty tiers
      description: Returns all loyalty tiers with their configuration
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tiers retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      tiers:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            min_lifetime_purchases:
                              type: number
                            point_value_tzs:
                              type: number
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/tiers/{tierId}:
    put:
      summary: Update loyalty tier
      description: Update tier configuration and recalculate all customer tiers
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: tierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - min_lifetime_purchases
                - point_value_tzs
              properties:
                min_lifetime_purchases:
                  type: number
                  minimum: 0
                point_value_tzs:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
      responses:
        '200':
          description: Tier updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: Invalid tier configuration (e.g., ordering violation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/customers:
    get:
      summary: List customers
      description: List customers with search, status, city, tier filters, near_deadline, and pagination
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: city
          in: query
          schema:
            type: string
          description: Case-insensitive exact match on customer city
        - name: tier
          in: query
          schema:
            type: string
          description: Filter by tier name (Bronze, Silver, Gold, Platinum)
        - name: near_deadline
          in: query
          schema:
            type: boolean
          description: Active customers whose deadline is within 5 days
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Customers retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      customers:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/customers/{customerCode}:
    get:
      summary: Get customer details
      description: Get details for a specific customer
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: customerCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Customer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/customers/{customerCode}:
    patch:
      summary: Update customer status
      description: Enable or disable a customer account
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: customerCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_active
              properties:
                is_active:
                  type: boolean
      responses:
        '200':
          description: Customer status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      customer_code:
                        type: string
                      is_active:
                        type: boolean
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/customers/{customerCode}/purchases:
    get:
      summary: Get customer purchases
      description: Get purchase history for a specific customer
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: customerCode
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Customer purchases retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      purchases:
                        type: array
                        items:
                          $ref: '#/components/schemas/Purchase'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/customers/{customerCode}/redeem:
    post:
      summary: Direct redemption (admin)
      description: Admin directly redeems points for a customer
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: customerCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - points
              properties:
                points:
                  type: integer
                  minimum: 1
                  maximum: 1000000
      responses:
        '200':
          description: Redemption completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      redemption_id:
                        type: string
                      reference:
                        type: string
                      status:
                        type: string
                      points:
                        type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/customers/{customerCode}/reset-pin:
    post:
      summary: Reset customer PIN
      description: Reset a customer's 6-digit PIN (Supabase Auth password)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: customerCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_pin
              properties:
                new_pin:
                  type: string
                  pattern: '^\\d{6}$'
      responses:
        '200':
          description: PIN reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      customer_code:
                        type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/redemptions:
    get:
      summary: List redemptions
      description: List redemptions with status filter and pagination
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed, cancelled]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Redemptions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      redemptions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Redemption'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/redemptions/{id}:
    get:
      summary: Get redemption details
      description: Get details for a specific redemption
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Redemption details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Redemption'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/redemptions/{id}/complete:
    post:
      summary: Complete redemption
      description: Admin approves a customer's redemption request
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Redemption completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      reference:
                        type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/redemptions/{id}/cancel:
    post:
      summary: Cancel redemption
      description: Cancel a redemption (pending or completed) and return points
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Redemption cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/reports/summary:
    get:
      summary: Get summary report
      description: Returns summary statistics for a date range with per-day breakdown
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Report generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      period:
                        type: object
                        properties:
                          from:
                            type: string
                          to:
                            type: string
                      summary:
                        type: object
                        properties:
                          purchases:
                            type: object
                            properties:
                              count:
                                type: integer
                              value:
                                type: number
                          points:
                            type: object
                            properties:
                              issued:
                                type: integer
                              redeemed:
                                type: integer
                              expired:
                                type: integer
                      daily_series:
                        type: array
                        items:
                          type: object
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/rules:
    get:
      summary: Get current point rules
      description: Returns the currently active point configuration
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Point rules retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      amount_per_point:
                        type: number
                      redemption_wait_days:
                        type: integer
                      inactivity_days:
                        type: integer
                      is_active:
                        type: boolean
                      created_at:
                        type: string
                      updated_at:
                        type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/rules:
    put:
      summary: Update point rules
      description: Update point rules for FUTURE purchases only (old purchases keep original values)
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount_per_point
                - redemption_wait_days
                - inactivity_days
              properties:
                amount_per_point:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1000000
                redemption_wait_days:
                  type: integer
                  minimum: 0
                  maximum: 365
                inactivity_days:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 365
      responses:
        '200':
          description: Point rules updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      rule:
                        type: object
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/audit-logs:
    get:
      summary: Get audit logs
      description: Retrieve audit logs with filters and pagination
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: admin
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Audit logs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLog'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  schemas:
    UserProfile:
      type: object
      properties:
        registered:
          type: boolean
        role:
          type: string
          enum: [customer, admin]
        profile:
          type: object
          properties:
            id:
              type: string
            full_name:
              type: string
            phone:
              type: string
            role:
              type: string
            is_active:
              type: boolean
            created_at:
              type: string
        customer:
          type: object
          nullable: true
          properties:
            id:
              type: string
            customer_code:
              type: string
            initials:
              type: string
            sequence_number:
              type: integer
            status:
              type: string
            points_balance:
              type: integer
            last_transaction_at:
              type: string
              nullable: true

    Customer:
      type: object
      properties:
        id:
          type: string
        customer_code:
          type: string
        initials:
          type: string
        sequence_number:
          type: integer
        status:
          type: string
          enum: [active, inactive]
        points_balance:
          type: integer
        last_transaction_at:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        tier_id:
          type: string
          format: uuid
          nullable: true
        tier:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            min_lifetime_purchases:
              type: number
            point_value_tzs:
              type: number
        created_at:
          type: string
        updated_at:
          type: string
        profiles:
          type: object
          properties:
            id:
              type: string
            full_name:
              type: string
            phone:
              type: string
            is_active:
              type: boolean

    Purchase:
      type: object
      properties:
        id:
          type: string
        transaction_reference:
          type: string
        purchase_amount:
          type: number
        points_earned:
          type: integer
        amount_per_point_used:
          type: number
        status:
          type: string
          enum: [completed, voided]
        purchased_at:
          type: string
        created_at:
          type: string
        customers:
          type: object
          properties:
            customer_code:
              type: string
            initials:
              type: string
        profiles:
          type: object
          properties:
            full_name:
              type: string

    Redemption:
      type: object
      properties:
        id:
          type: string
        customer_id:
          type: string
        points_redeemed:
          type: integer
        redemption_reference:
          type: string
        source:
          type: string
          enum: [customer_request, admin_direct]
        status:
          type: string
          enum: [pending, completed, cancelled]
        processed_by:
          type: string
          nullable: true
        completed_at:
          type: string
          nullable: true
        cancelled_by:
          type: string
          nullable: true
        cancelled_at:
          type: string
          nullable: true
        cancel_reason:
          type: string
          nullable: true
        redeemed_at:
          type: string
        created_at:
          type: string

    AuditLog:
      type: object
      properties:
        id:
          type: string
        admin_id:
          type: string
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        description:
          type: string
        metadata:
          type: object
        created_at:
          type: string
        profiles:
          type: object
          properties:
            full_name:
              type: string
            phone:
              type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string

    AccountDisabled:
      description: Account has been deactivated
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: object
