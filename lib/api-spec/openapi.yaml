openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: authentication
    description: Phone verification and customer registration
  - name: customer
    description: Customer loyalty account data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/otp/request:
    post:
      operationId: requestPhoneOtp
      tags: [authentication]
      summary: Request a one-time phone code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPhoneOtpRequest"
      responses:
        "200":
          description: OTP challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestPhoneOtpResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /auth/otp/verify:
    post:
      operationId: verifyPhoneOtp
      tags: [authentication]
      summary: Verify a one-time phone code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPhoneOtpRequest"
      responses:
        "200":
          description: Existing customer session or a registration session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyPhoneOtpResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
  /auth/register:
    post:
      operationId: completeCustomerRegistration
      tags: [authentication]
      summary: Complete registration after phone verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRegistrationRequest"
      responses:
        "201":
          description: Customer account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSessionResponse"
        "400":
          $ref: "#/components/responses/ApiError"
  /customer/me:
    get:
      operationId: getCustomerProfile
      tags: [customer]
      summary: Get the signed-in customer's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "401":
          $ref: "#/components/responses/ApiError"
  /customer/dashboard:
    get:
      operationId: getCustomerDashboard
      tags: [customer]
      summary: Get backend-calculated point balances and eligibility
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer points summary and redemption eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDashboard"
        "401":
          $ref: "#/components/responses/ApiError"
  /customer/transactions:
    get:
      operationId: listCustomerTransactions
      tags: [customer]
      summary: List purchase transactions and earned points
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer purchase transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerTransactionList"
        "401":
          $ref: "#/components/responses/ApiError"
  /customer/redemptions:
    get:
      operationId: listCustomerRedemptions
      tags: [customer]
      summary: List the customer's previous redemptions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer redemption history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerRedemptionList"
        "401":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createCustomerRedemption
      tags: [customer]
      summary: Request redemption of available points
      description: The server must validate account status, point availability, expiry, activity rules, and redemption eligibility.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRedemptionRequest"
      responses:
        "201":
          description: Redemption completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerRedemption"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    ApiError:
      description: Request rejected by the API
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        detail:
          type: string
      required: [message]
    CustomerProfile:
      type: object
      properties:
        customerId:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
        status:
          type: string
          enum: [active, inactive]
        unusedPointsExpired:
          type: boolean
      required: [customerId, fullName, phoneNumber, status, unusedPointsExpired]
    RequestPhoneOtpRequest:
      type: object
      properties:
        phoneNumber:
          type: string
          description: Customer phone number in E.164 format
      required: [phoneNumber]
    RequestPhoneOtpResponse:
      type: object
      properties:
        challengeId:
          type: string
        maskedPhoneNumber:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [challengeId, maskedPhoneNumber, expiresAt]
    VerifyPhoneOtpRequest:
      type: object
      properties:
        challengeId:
          type: string
        phoneNumber:
          type: string
        code:
          type: string
          minLength: 4
          maxLength: 8
      required: [challengeId, phoneNumber, code]
    VerifyPhoneOtpResponse:
      type: object
      properties:
        status:
          type: string
          enum: [authenticated, registration_required]
        accessToken:
          type: string
          description: Returned only for an existing signed-in customer
        registrationToken:
          type: string
          description: Short-lived token required to complete new customer registration
        customer:
          $ref: "#/components/schemas/CustomerProfile"
      required: [status]
    CompleteRegistrationRequest:
      type: object
      properties:
        registrationToken:
          type: string
        fullName:
          type: string
          minLength: 2
          maxLength: 120
      required: [registrationToken, fullName]
    CustomerSessionResponse:
      type: object
      properties:
        accessToken:
          type: string
        customer:
          $ref: "#/components/schemas/CustomerProfile"
      required: [accessToken, customer]
    CustomerDashboard:
      type: object
      properties:
        customer:
          $ref: "#/components/schemas/CustomerProfile"
        totalPoints:
          type: integer
          minimum: 0
        redeemablePoints:
          type: integer
          minimum: 0
        pendingPoints:
          type: integer
          minimum: 0
        redemptionEligible:
          type: boolean
        redemptionBlockedReason:
          type: string
          nullable: true
        activityDeadline:
          type: string
          format: date-time
          nullable: true
        nextPointsAvailableAt:
          type: string
          format: date-time
          nullable: true
      required:
        - customer
        - totalPoints
        - redeemablePoints
        - pendingPoints
        - redemptionEligible
        - redemptionBlockedReason
        - activityDeadline
        - nextPointsAvailableAt
    CustomerTransaction:
      type: object
      properties:
        id:
          type: string
        purchaseAmount:
          type: number
          minimum: 0
        pointsEarned:
          type: integer
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        reference:
          type: string
      required: [id, purchaseAmount, pointsEarned, occurredAt, reference]
    CustomerTransactionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerTransaction"
      required: [items]
    CustomerRedemption:
      type: object
      properties:
        id:
          type: string
        pointsRedeemed:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        reference:
          type: string
        status:
          type: string
          enum: [completed, pending, rejected]
      required: [id, pointsRedeemed, occurredAt, reference, status]
    CustomerRedemptionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerRedemption"
      required: [items]
    CreateCustomerRedemptionRequest:
      type: object
      properties:
        points:
          type: integer
          minimum: 1
      required: [points]

