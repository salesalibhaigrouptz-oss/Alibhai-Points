kind = "mobile"
previewPath = "/"
title = "Alibhai Points"
description = "A simple customer mobile app for Tanzanian Alibhai customers to check loyalty points, account status, transactions, redemption eligibility, and redemption history."
version = "1.0.0"
id = "artifacts/alibhai-points"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23455

[services.development]
run = "pnpm --filter @workspace/alibhai-points run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alibhai-points", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/alibhai-points", "run", "serve" ]

[services.env]
PORT = "23455"
BASE_PATH = "/"
